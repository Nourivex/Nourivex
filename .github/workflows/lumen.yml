# Keeps the profile alive: real stats every morning, and Lumi falls asleep at night.
# Cron is UTC. 23:00 UTC = 06:00 WIB (wake up), 15:00 UTC = 22:00 WIB (sleep).
# If you change "timezone"/"nightHours" in profile.config.json, shift these too.
name: lumen

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['profile.config.json', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: lumen
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch stats
        # Optional secret GH_STATS_TOKEN (a PAT) also counts private contributions.
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Render assets + README
        run: node scripts/build.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md SECRET.md
          git diff --cached --quiet || (git commit -m "chore(lumen): refresh profile assets" && git push)
